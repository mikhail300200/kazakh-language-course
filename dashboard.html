<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Курс беті - Қазақ тілі</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                linear-gradient(
                    rgba(255, 248, 225, 0.95),
                    rgba(245, 222, 179, 0.9)
                ),
                url('https://www.transparenttextures.com/patterns/kazakh-ornament.png');

            background-size: auto, 200px;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 245, 0.95);
            border-radius: 50px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #E6D3B3;
        }

        .lesson-card {
            border: 1px solid #DDBF8C;
            border-radius: 20px;
            padding: 15px;
            margin: 12px 0;
            background: #FFFCF8;
            transition: 0.3s;
        }

        .lesson-card.available {
            cursor: pointer;
            border-left: 5px solid #4CAF50;
        }

        .lesson-card.locked {
            opacity: 0.6;
            background: #f5f5f5;
        }

        .badge {
            background: #4CAF50;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            margin-top: 10px;
        }

        .progress-fill {
            background: #4CAF50;
            height: 10px;
            border-radius: 10px;
            width: 0%;
        }

        h1 {
            color: #5A3A1A;
            text-align: center;
            margin-bottom: 25px;
        }

        .red-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto 0;
            width: 200px;
        }

        .gold-btn {
            background: gold;
            color: black;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        /* =========================
           ПРОФИЛЬ
        ========================= */

        .profile-btn {
            display: flex !important;
            align-items: center;
            gap: 10px;
            width: fit-content;
            margin: 0 0 20px auto;
            padding: 7px 14px 7px 7px;
            background: linear-gradient(135deg, #ffffff, #fff8ec);
            color: #5A3A1A !important;
            border: 1px solid #DDBF8C;
            border-radius: 50px;
            text-decoration: none !important;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(90, 58, 26, 0.15);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .profile-avatar {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: linear-gradient(135deg, #8B5A2B, #5A3A1A);
            color: white;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .profile-arrow {
            font-size: 22px;
            line-height: 1;
            color: #8B5A2B;
            transition: transform 0.25s;
        }

        .profile-btn:hover {
            background: #fff3df;
            border-color: #C99C61;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(90,58,26,0.20);
        }

        .profile-btn:hover .profile-arrow {
            transform: translateX(3px);
        }

        /* =========================
           DEVELOPER ПАНЕЛЬ
        ========================= */

        #developerPanel {
            margin-top: 25px;
        }

        #developerPanel h2 {
            color: #5A3A1A;
            margin-bottom: 12px;
        }

        .dev-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dev-grid button,
        .dev-grid a {
            background: #f5f5f5;
            color: #222;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 5px 9px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .dev-grid button:hover,
        .dev-grid a:hover {
            background: #e9e9e9;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .profile-btn {
                font-size: 14px;
                padding: 6px 12px 6px 6px;
            }

            .profile-avatar {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
        }

        /* =========================
   ХАБАРЛАМАЛАР
========================= */

.top-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.notification-wrapper {
    position: relative;
}

.notification-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid #DDBF8C;
    background: linear-gradient(135deg, #ffffff, #fff8ec);
    cursor: pointer;
    font-size: 22px;
    box-shadow: 0 4px 12px rgba(90,58,26,0.15);
    position: relative;
}

.notification-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #f44336;
    color: white;
    min-width: 21px;
    height: 21px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
}

.notification-panel {
    display: none;
    position: absolute;
    right: 0;
    top: 62px;
    width: 340px;
    max-height: 400px;
    overflow-y: auto;
    background: white;
    border: 1px solid #DDBF8C;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    z-index: 1000;
}

.notification-panel.show {
    display: block;
}

.notification-panel h3 {
    color: #5A3A1A;
    margin-bottom: 12px;
}

.notification-item {
    background: #f7f3ed;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    font-size: 14px;
}

.notification-empty {
    text-align: center;
    color: #999;
    padding: 20px 5px;
}

.clear-notifications {
    width: 100%;
    border: none;
    background: #8B5A2B;
    color: white;
    padding: 9px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 5px;
}
    </style>
</head>

<body>

<div class="container">

    <div class="top-actions">

    <div class="notification-wrapper">

        <button
            class="notification-btn"
            onclick="toggleNotifications()">

            🔔

            <span
                class="notification-count"
                id="notificationCount">
                0
            </span>

        </button>

        <div
            class="notification-panel"
            id="notificationPanel">

            <h3>🔔 Хабарламалар</h3>

            <div id="notificationList"></div>

            <button
                class="clear-notifications"
                onclick="clearNotifications()">

                ✓ Барлығын оқылды деп белгілеу

            </button>

        </div>

    </div>


    <a href="profile.html" class="profile-btn"
       style="margin:0;">

        <span
            class="profile-avatar"
            id="profileAvatar">
            R
        </span>

        <span>Менің профилім</span>

        <span class="profile-arrow">›</span>

    </a>

</div>

    <h1>📚 Қазақ тілі курсы</h1>

    <!-- САБАҚТАР -->
    <div id="lessonsList"></div>

    <!-- ПРОГРЕСС -->
    <div style="margin-top:30px;">

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <p id="progressText"
           style="text-align:center; margin-top:10px; color:#4F2F10;">
        </p>

    </div>

    <button class="red-btn" onclick="logout()">
        Шығу
    </button>

</div>


<script>

    // ==========================================
    // КІРУДІ ТЕКСЕРУ
    // ==========================================

    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'index.html';
    }


    // ==========================================
    // ҚАЗІРГІ ҚОЛДАНУШЫ
    // ==========================================

    let currentUser = JSON.parse(
        localStorage.getItem('currentUser')
    );


    // ==========================================
    // ПРОФИЛЬДЕГІ АВАТАР ӘРПІ
    // ==========================================

    if (currentUser && currentUser.fullname) {

        let firstLetter =
            currentUser.fullname
                .charAt(0)
                .toUpperCase();

        document.getElementById(
            'profileAvatar'
        ).textContent = firstLetter;
    }


    // ==========================================
    // САБАҚТАР
    // ==========================================

    const lessons = [
        { id: 1, title: "1-сабақ", duration: "15 минут" },
        { id: 2, title: "2-сабақ", duration: "15 минут" },
        { id: 3, title: "3-сабақ", duration: "15 минут" },
        { id: 4, title: "4-сабақ", duration: "15 минут" },
        { id: 5, title: "5-сабақ", duration: "15 минут" },
        { id: 6, title: "6-сабақ", duration: "15 минут" }
    ];


    // ==========================================
    // EMAIL
    // ==========================================

    function getUserEmail() {

        if (currentUser && currentUser.email) {
            return currentUser.email;
        }

        return 'guest';
    }


    // ==========================================
    // DEVELOPER ТЕКСЕРУ
    // ==========================================

    function isDeveloper() {

        if (!currentUser) {
            return false;
        }

        return currentUser.role === 'developer';
    }


    // ==========================================
    // ЖЕКЕ ПРОГРЕСС КІЛТІ
    // ==========================================

    function getProgressKey(lessonId) {

        return getUserEmail()
            + '_lesson'
            + lessonId
            + '_test_passed';
    }


    // ==========================================
    // ҚОЛЖЕТІМДІ САБАҚТАР
    // ==========================================

    function getUnlockedLessons() {

        // Developer-ге бәрі ашық
        if (isDeveloper()) {
            return [1, 2, 3, 4, 5, 6];
        }

        // Оқушыға бастапқыда тек 1-сабақ
        let unlocked = [1];

        for (let i = 2; i <= 6; i++) {

            if (
                localStorage.getItem(
                    getProgressKey(i - 1)
                ) === 'true'
            ) {
                unlocked.push(i);
            }
        }

        return unlocked;
    }


    // ==========================================
    // DASHBOARD
    // ==========================================

    function loadDashboard() {

        let unlocked = getUnlockedLessons();
        let completed = [];

        // Өтілген сабақтарды анықтау
        for (let i = 1; i <= 6; i++) {

            if (
                localStorage.getItem(
                    getProgressKey(i)
                ) === 'true'
            ) {
                completed.push(i);
            }
        }


        let html = '';

        lessons.forEach(lesson => {

            let isUnlocked =
                unlocked.includes(lesson.id);

            let isCompleted =
                completed.includes(lesson.id);

            html += `
                <div
                    class="lesson-card ${isUnlocked ? 'available' : 'locked'}"
                    onclick="${isUnlocked ? `openLesson(${lesson.id})` : ''}"
                >

                    <div style="
                        display:flex;
                        justify-content:space-between;
                    ">

                        <div>

                            <h3>
                                📖 ${lesson.title}
                            </h3>

                            <p>
                                ⏱️ ${lesson.duration}
                            </p>

                            ${
                                isCompleted
                                ? '<span class="badge">✅ Өтілген</span>'
                                : ''
                            }

                        </div>

                        <div>
                            ${!isUnlocked ? '🔒' : ''}
                        </div>

                    </div>

                    ${
                        isCompleted
                        ? `
                            <div class="progress-bar">
                                <div
                                    class="progress-fill"
                                    style="width:100%">
                                </div>
                            </div>
                        `
                        : ''
                    }

                </div>
            `;
        });


        document.getElementById(
            'lessonsList'
        ).innerHTML = html;


        // ======================================
        // ПРОГРЕСС
        // ======================================

        let percent =
            (completed.length / 6) * 100;

        document.getElementById(
            'progressFill'
        ).style.width = percent + '%';

        document.getElementById(
            'progressText'
        ).innerHTML =
            `✅ ${completed.length}/6 сабақ өтілді (${Math.round(percent)}%)`;


        // ======================================
        // СЕРТИФИКАТ
        // ======================================

        if (completed.length === 6 || isDeveloper()) {

            const btn =
                document.createElement('div');

            btn.innerHTML = `
                <button
                    class="gold-btn"
                    onclick="window.location.href='certificate.html'"
                >
                    🎓 СЕРТИФИКАТ АЛУ 🎓
                </button>
            `;

            document.getElementById(
                'lessonsList'
            ).appendChild(btn);
        }
    }


    // ==========================================
    // САБАҚТЫ АШУ
    // ==========================================

    function openLesson(id) {

        localStorage.setItem(
            'currentLesson',
            id
        );

        window.location.href =
            'lesson.html';
    }

    // ==========================================
    // ШЫҒУ
    // ==========================================

    function logout() {

        localStorage.removeItem(
            'isLoggedIn'
        );

        localStorage.removeItem(
            'currentUser'
        );

        alert('Шықтыңыз!');

        window.location.href =
            'index.html';
    }


    // ==========================================
    // ІСКЕ ҚОСУ
    // ==========================================

    // ==========================================
// 🔔 ХАБАРЛАМАЛАР
// ==========================================

function getNotificationKey() {
    return getUserEmail() + '_notifications';
}


function getNotifications() {

    return JSON.parse(
        localStorage.getItem(
            getNotificationKey()
        ) || '[]'
    );
}


function loadNotifications() {

    let notifications =
        getNotifications();

    let list =
        document.getElementById(
            'notificationList'
        );

    let count =
        document.getElementById(
            'notificationCount'
        );


    if (notifications.length === 0) {

        list.innerHTML = `
            <div class="notification-empty">
                Жаңа хабарлама жоқ
            </div>
        `;

        count.style.display = 'none';

        return;
    }


    count.textContent =
        notifications.length;

    count.style.display =
        'flex';


    list.innerHTML =
        notifications
            .slice()
            .reverse()
            .map(notification => `
                <div class="notification-item">
                    ${notification.text}
                </div>
            `)
            .join('');
}


function toggleNotifications() {

    document.getElementById(
        'notificationPanel'
    ).classList.toggle('show');
}


function clearNotifications() {

    localStorage.setItem(
        getNotificationKey(),
        JSON.stringify([])
    );

    loadNotifications();

    document.getElementById(
        'notificationPanel'
    ).classList.remove('show');
}


loadNotifications();
    
    loadDashboard();

</script>

</body>
</html>
