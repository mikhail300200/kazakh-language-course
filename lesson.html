<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Видео сабақ - Қазақ тілі</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5ede0;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 245, 0.95);
            border-radius: 50px;
            padding: 30px;
            border: 1px solid #E6D3B3;
        }
        h1 { color: #5A3A1A; text-align: center; margin-bottom: 20px; }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .task-box { background: #FFFCF8; padding: 20px; border-radius: 30px; margin-top: 20px; border: 1px solid #DDBF8C; }
        .task-img { max-width: 100%; border-radius: 20px; margin: 15px 0; border: 1px solid #DDBF8C; }
        textarea { width: 100%; padding: 12px; border-radius: 20px; border: 1px solid #DDBF8C; font-size: 16px; background: white; }
        button { background: #8B5A2B; color: white; padding: 12px 25px; border: none; border-radius: 40px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button.gray { background: #6c757d; }
        button.blue { background: #2196F3; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="lessonTitle">Сабақ</h1>
    <div id="videoPlayer" class="video-container"></div>
    <div class="task-box">
        <h3>✍️ Тапсырма</h3>
        <img id="taskImage" class="task-img" src="" alt="Тапсырма суреті">
        <textarea id="answer" rows="4" placeholder="Жауабыңызды жазыңыз..."></textarea>
        <button onclick="submitTask()">📤 Тапсыру</button>
    </div>
    <br>
    <button class="gray" onclick="backToDashboard()">← Курс бетіне</button>
    <button id="nextBtn" class="blue" onclick="goToQuiz()" style="display:none;">📋 Тестке өту →</button>
</div>
<script>
    const lessonsData = {
    1: {
        videoUrl: "https://www.youtube.com/embed/u-f1asK70C8",
        taskImage: "task_images/sabaq1_task.png"
    },
    2: {
        videoUrl: "https://www.youtube.com/embed/hnx0GCBaytQ",
        taskImage: "task_images/sabaq2_task.png"
    },
    3: {
        videoUrl: "https://www.youtube.com/embed/e2uvlcO1I-0",
        taskImage: "task_images/sabaq3_task.png"
    },
    4: {
        videoUrl: "https://www.youtube.com/embed/DbPYhxIVREE",
        taskImage: "task_images/sabaq4_task.png"
    },
    5: {
        videoUrl: "https://www.youtube.com/embed/ecOsz5A1vXQ",
        taskImage: "task_images/sabaq5_task.png"
    },
    6: {
        videoUrl: "https://www.youtube.com/embed/6LZCg86MS3Q",
        taskImage: "task_images/sabaq6_task.png"
    }
};

    let lessonId = parseInt(localStorage.getItem('currentLesson'));
    let taskDone = localStorage.getItem('lesson'+lessonId+'_task_done') === 'true';

    function loadLesson() {
        document.getElementById('lessonTitle').innerHTML = lessonId + " - Сабақ";
        let data = lessonsData[lessonId];
        document.getElementById('taskImage').src = data.taskImage;

        if(data.videoUrl && data.videoUrl !== "") {
            let videoHtml = `<iframe src="${data.videoUrl}" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('videoPlayer').innerHTML = videoHtml;
        } else {
            document.getElementById('videoPlayer').innerHTML = '<p style="color:orange; text-align:center;">⚠️ Видео әлі қосылмаған. Кейінірек қосылады.</p>';
        }

        let savedAnswer = localStorage.getItem('lesson'+lessonId+'_answer');
        if(savedAnswer) document.getElementById('answer').value = savedAnswer;
        if(taskDone) document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function submitTask() {
        let answer = document.getElementById('answer').value;
        if(answer.length < 3) { alert('Жауабыңызды жазыңыз!'); return; }
        localStorage.setItem('lesson'+lessonId+'_answer', answer);
        localStorage.setItem('lesson'+lessonId+'_task_done', 'true');
        alert('Тапсырма қабылданды!');
        document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function goToQuiz() { localStorage.setItem('quizLessonId', lessonId); window.location.href = 'quiz.html'; }
    function backToDashboard() { window.location.href = 'dashboard.html'; }
    if(localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    loadLesson();
</script>
</body>
</html>
