<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Кіру - Қазақ тілі курсы</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(255, 248, 225, 0.95), rgba(245, 222, 179, 0.9)), url('https://www.transparenttextures.com/patterns/kazakh-ornament.png');
            background-size: auto, 200px;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 245, 0.95);
            border-radius: 60px 60px 60px 20px;
            padding: 40px 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid #E6D3B3;
        }

        .login-container h1 {
            font-size: 36px;
            color: #5A3A1A;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-container label {
            display: block;
            font-size: 16px;
            color: #4F2F10;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .login-container input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #DDBF8C;
            border-radius: 30px;
            font-size: 16px;
            background: white;
            transition: 0.3s;
        }

        .login-container input:focus {
            outline: none;
            border-color: #8B5A2B;
            box-shadow: 0 0 5px rgba(139, 90, 43, 0.3);
        }

        .login-container button {
            width: 100%;
            background: #8B5A2B;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-container button:hover {
            background: #5A3A1A;
            transform: scale(1.02);
        }

        .login-container p {
            text-align: center;
            margin-top: 20px;
            color: #6B4226;
        }

        .login-container a {
            color: #8B5A2B;
            text-decoration: none;
            font-weight: bold;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Кіру</h1>
        <label>Email:</label>
        <input type="email" id="email" placeholder="example@email.com">
        <label>Құпия сөз:</label>
        <input type="password" id="password" placeholder="********">
        <button onclick="login()">Кіру</button>
        <p>Аккаунтыңыз жоқ па? <a href="register.html">Тіркелу</a></p>
        <div class="back-link"><a href="index.html">← Басты бетке</a></div>
    </div>
    
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWSjtJ1X8axYVb6N4xsiZNMC64-Jab0PQ",
  authDomain: "kazakh-language-course.firebaseapp.com",
  projectId: "kazakh-language-course",
  storageBucket: "kazakh-language-course.firebasestorage.app",
  messagingSenderId: "661860929616",
  appId: "1:661860929616:web:07f6a588cd90cd67e40155",
  measurementId: "G-P32VDGB103"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const button = document.querySelector(".login-container button");

  if (!email || !password) {
    alert("Email және құпия сөзді толтырыңыз!");
    return;
  }

  button.disabled = true;
  button.textContent = "Кіруде...";

  try {
    const result = await signInWithEmailAndPassword(
      auth, email, password
    );

    const user = result.user;

    // Бұрынғы жеке кабинетпен уақытша үйлесімділік
    const userData = {
      fullname: user.displayName || "Оқушы",
      email: user.email,
      uid: user.uid
    };

    localStorage.setItem(
      "currentUser",
      JSON.stringify(userData)
    );
    localStorage.setItem("isLoggedIn", "true");

    alert("Қош келдіңіз, " + userData.fullname + "!");
    window.location.href = "dashboard.html";

  } catch (error) {
    console.error(error);

    const messages = {
      "auth/invalid-credential": "Email немесе құпия сөз қате!",
      "auth/invalid-email": "Email дұрыс емес!",
      "auth/user-disabled": "Аккаунт бұғатталған!",
      "auth/too-many-requests": "Тым көп әрекет жасалды!",
      "auth/network-request-failed": "Интернет байланысын тексеріңіз!"
    };

    alert(
      messages[error.code] ||
      "Кіру қатесі: " + error.code
    );

  } finally {
    button.disabled = false;
    button.textContent = "Кіру";
  }
};
</script>
</body>
</html>
