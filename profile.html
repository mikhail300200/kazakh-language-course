<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Менің профилім</title>

    <link rel="stylesheet" href="style.css">a

    <style>

        .profile-container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .profile-header {
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #8B5A2B;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }

        .profile-header h1 {
            margin-bottom: 5px;
        }

        .username {
            color: #777;
            margin-bottom: 25px;
        }

        .profile-info {
            margin-top: 25px;
        }

        .info-box {
            background: #f7f3ed;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-size: 16px;
        }

        .progress-section {
            margin-top: 30px;
        }

        .progress-section h3 {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 18px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: 0.5s;
        }

        #progressText {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }


        /* =========================
           МЕНІҢ НӘТИЖЕЛЕРІМ
        ========================= */

        .results-section {
            margin-top: 30px;
        }

        .results-section h3 {
            margin-bottom: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #f7f3ed;

            padding: 14px 16px;
            margin-bottom: 10px;

            border-radius: 12px;
        }

        .result-lesson {
            font-weight: bold;
        }

        .result-score {
            font-weight: bold;
            color: #4CAF50;
        }

        .result-empty {
            color: #999;
        }

        .average-result {
            margin-top: 15px;
            padding: 15px;

            background: #fff4d6;

            border-radius: 12px;

            text-align: center;
            font-weight: bold;
            font-size: 17px;
        }


        /* =========================
           КНОПКАЛАР
        ========================= */

        .profile-buttons {
            margin-top: 30px;
        }

        .course-btn {
            display: block;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .course-btn:hover {
            background: #3d9140;
        }

        .logout-btn {
            width: 100%;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

    </style>

</head>


<body>


<div class="profile-container">


    <!-- АВАТАР -->

    <div class="profile-header">

        <div class="avatar" id="avatar">
            R
        </div>

        <h1>Менің профилім</h1>

        <p class="username" id="username">
            ratmir
        </p>

    </div>



    <!-- АҚПАРАТ -->

    <div class="profile-info">

        <div class="info-box">
            👤 <strong>Пайдаланушы:</strong>
            <span id="fullname">ratmir</span>
        </div>


        <div class="info-box">
            📧 <strong>Email:</strong>
            <span id="email"></span>
        </div>


        <div class="info-box">
            📚 <strong>Курс:</strong>
            Қазақ тілі
        </div>


        <div class="info-box">
            🎓 <strong>Сынып:</strong>
            5-сынып
        </div>

    </div>



    <!-- ОҚУ ПРОГРЕСІ -->

    <div class="progress-section">

        <h3>
            📊 Оқу прогресі
        </h3>

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <p id="progressText">
            0 / 6 сабақ өтілді
        </p>

    </div>



    <!-- МЕНІҢ НӘТИЖЕЛЕРІМ -->

    <div class="results-section">

        <h3>
            📊 Менің нәтижелерім
        </h3>

        <div id="resultsList">
        </div>

        <div
            class="average-result"
            id="averageResult">

            📈 Орташа нәтиже: —

        </div>

    </div>



    <!-- КНОПКАЛАР -->

    <div class="profile-buttons">

        <a
            href="dashboard.html"
            class="course-btn">

            📚 Оқуды жалғастыру

        </a>


        <button
            class="logout-btn"
            onclick="logout()">

            🚪 Аккаунттан шығу

        </button>

    </div>


</div>



<script>

    // ==============================
    // АВТОРИЗАЦИЯНЫ ТЕКСЕРУ
    // ==============================

    if (
        localStorage.getItem("isLoggedIn") !== "true"
    ) {
        window.location.href = "login.html";
    }



    // ==============================
    // ПАЙДАЛАНУШЫ
    // ==============================

    let currentUser =
        JSON.parse(
            localStorage.getItem("currentUser") || "{}"
        );


    if (!currentUser.email) {
        window.location.href = "login.html";
    }



    // Аты-жөні

    document.getElementById("fullname")
        .textContent =
        currentUser.fullname || "Пайдаланушы";


    document.getElementById("username")
        .textContent =
        currentUser.fullname || "Пайдаланушы";


    // Email

    document.getElementById("email")
        .textContent =
        currentUser.email;


    // Аватар

    let firstLetter =
        (currentUser.fullname || "P")
        .charAt(0)
        .toUpperCase();


    document.getElementById("avatar")
        .textContent =
        firstLetter;



    // ==============================
    // ОҚУ ПРОГРЕСІ
    // ==============================

    let completedLessons = 0;


    for (let i = 1; i <= 6; i++) {

        let progressKey =
            currentUser.email +
            "_lesson" +
            i +
            "_test_passed";


        if (
            localStorage.getItem(progressKey)
            === "true"
        ) {
            completedLessons++;
        }

    }


    let progressPercent =
        Math.round(
            completedLessons / 6 * 100
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        progressPercent + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        completedLessons +
        " / 6 сабақ өтілді (" +
        progressPercent +
        "%)";



    // ==============================
    // ТЕСТ НӘТИЖЕЛЕРІ
    // ==============================

function loadResults() {

    let resultsList = document.getElementById("resultsList");
    resultsList.innerHTML = "";

    let totalScore = 0;
    let resultCount = 0;

    for (let i = 1; i <= 6; i++) {

        let scoreKey =
            currentUser.email +
            "_lesson" +
            i +
            "_score";

        let percentKey =
            currentUser.email +
            "_lesson" +
            i +
            "_percent";

        let score = localStorage.getItem(scoreKey);
        let testPercent = localStorage.getItem(percentKey);

        let item = document.createElement("div");
        item.className = "result-item";

        if (score !== null) {

            // Бұрын /10 форматында сақталған нәтижені
            // /5 форматына айналдырамыз
            let score5 = Number(score);

            if (score5 > 5) {
                score5 = Math.round(score5 / 2);
            }

            // Пайызға қарап өтті/өтпеді
            let passed = Number(testPercent) >= 70;

            item.innerHTML = `
                <span class="result-lesson">
                    📘 ${i}-сабақ
                </span>

                <span class="${passed ? 'result-score' : 'result-empty'}">
                    ${score5}/5
                    &nbsp;
                    ${testPercent}%
                    ${passed ? '✅' : '❌'}
                </span>
            `;

            totalScore += score5;
            resultCount++;

        } else {

            item.innerHTML = `
                <span class="result-lesson">
                    📘 ${i}-сабақ
                </span>

                <span class="result-empty">
                    — Әлі тапсырылмады
                </span>
            `;
        }

        resultsList.appendChild(item);
    }


    // ОРТАША НӘТИЖЕ

    if (resultCount > 0) {

        let average =
            totalScore / resultCount;

        let averagePercent =
            Math.round((average / 5) * 100);

        document.getElementById("averageResult").textContent =
            "📈 Орташа нәтиже: " +
            average.toFixed(1) +
            "/5 (" +
            averagePercent +
            "%)";

    } else {

        document.getElementById("averageResult").textContent =
            "📈 Орташа нәтиже: —";
    }
}

loadResults();



    // ==============================
    // ШЫҒУ
    // ==============================

    function logout() {

        localStorage.removeItem(
            "isLoggedIn"
        );

        localStorage.removeItem(
            "currentUser"
        );


        window.location.href =
            "index.html";

    }

</script>


</body>

</html>
